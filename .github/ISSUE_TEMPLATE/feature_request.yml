name: 功能建议
description: 提出新功能或改进建议
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述使用场景与痛点，而不是直接给出实现方案
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的行为
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 该建议不涉及结构认证或 GB/ISO 合规声明
          required: false
